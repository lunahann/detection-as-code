title: PowerShell Execution With Encoded Command
id: 12c219b0-19d6-47a7-9be0-ca87079dc666
status: experimental
description: |
  Detects PowerShell launched with the -EncodedCommand parameter (or its abbreviations).
  Attackers base64-encode commands to evade simple command-line inspection.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
author: Ekin
date: 2026-11-03
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense-evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
    - OriginalFileName:
        - 'PowerShell.EXE'
        - 'pwsh.dll'
  selection_flag:
    CommandLine|contains|windash:
      - ' -e '
      - ' -en '
      - ' -enc '
      - ' -enco'
      - ' -ec '
      - ' -EncodedCommand'
  condition: all of selection_*
falsepositives:
  - Management and deployment tools (SCCM, Intune, RMM agents) that encode their scripts
  - Tune by excluding known parent processes after baselining
level: medium
