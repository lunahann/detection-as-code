name: Detection CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-and-convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sigma tooling
        run: pip install -r requirements.txt

      - name: Sigma syntax and best-practice checks
        run: sigma check rules/

      - name: House metadata standards
        run: python scripts/validate_metadata.py

      - name: Convert to Elastic and KQL
        run: bash scripts/convert.sh

      - name: Upload converted queries
        uses: actions/upload-artifact@v4
        with:
          name: converted-detections
          path: build/
